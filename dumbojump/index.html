<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dumbo Jump 덤보점프</title>
<meta name="description" content="선 하나로 7,000m 심해에서 수면까지 · Draw a line and climb 7,000 m from the deep sea">
<meta property="og:title" content="Dumbo Jump 덤보점프">
<meta property="og:description" content="선 하나로 7,000m 심해에서 수면까지">
<meta property="og:image" content="https://nekarose.github.io/games/assets/dumbojump_logo.png">
<meta property="og:type" content="website">
<link rel="icon" href="../assets/dumbojump_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<script>
var SRC = (new URLSearchParams(location.search).get("src") || "").replace(/[^a-z0-9_-]/gi, "").slice(0, 40);
function iosUrl(id) { return "https://apps.apple.com/app/id" + id; }
function playUrl(pkg, content) {
  var u = "https://play.google.com/store/apps/details?id=" + pkg;
  if (SRC) u += "&referrer=" + encodeURIComponent("utm_source=" + SRC + "&utm_medium=social&utm_campaign=link&utm_content=" + content);
  return u;
}
var UA = navigator.userAgent;
// iPadOS reports itself as a Mac; a Mac with a touch screen is an iPad.
var IS_IOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
var IS_ANDROID = /Android/.test(UA);
function soon(a) {
  a.removeAttribute("href"); a.classList.add("soon");
  a.querySelector("span, .lbl").textContent = /^ko\b/i.test(navigator.language || "") ? "Google Play 곧 출시" : "Google Play coming soon";
}
function applyLang() {
  if (/^ko\b/i.test(navigator.language || "")) return;
  document.documentElement.lang = "en";
  document.querySelectorAll("[data-en]").forEach(function (el) { el.textContent = el.dataset.en; });
}

var IOS = iosUrl("6812717941"), PLAY = playUrl("com.nekarose.dumbojump", "dumbojump");
var PLAY_LIVE = false;
// Redirect before first paint. If an in-app browser blocks it, the buttons below still work.
if (!/[?&]stay\b/.test(location.search)) {
  if (IS_IOS) location.replace(IOS); else if (IS_ANDROID && PLAY_LIVE) location.replace(PLAY);
}
</script>
<style>
*{box-sizing:border-box} html,body{margin:0;min-height:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;
 background:linear-gradient(165deg,#1f6fb8 0%,#123f7a 45%,#081a3a 100%);
 font-family:"Do Hyeon","Apple SD Gothic Neo",system-ui,sans-serif;color:#fff;text-align:center}
main{width:100%;max-width:420px}
.logo{width:min(300px,78vw);height:auto;filter:drop-shadow(0 12px 18px rgba(10,20,80,.35))}
h1{margin:18px 0 4px;font-weight:400;font-size:26px;line-height:1.3;paint-order:stroke fill;-webkit-text-stroke:6px #1a1f5c}
h1 b{display:block;color:#FFD23F;font-weight:400;font-size:40px}
.sub{margin:10px 0 28px;font-size:17px;opacity:.92}
.foot{margin-top:18px;font-size:14px;opacity:.85} .foot a{color:#fff}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:0 0 14px;
 padding:16px 20px 13px;border:5px solid #fff;border-radius:999px;text-decoration:none;color:#fff;font-size:22px;
 background:linear-gradient(180deg,#FFB43A 0%,#FF7A1A 100%);box-shadow:0 7px 0 rgba(20,20,70,.45);transition:transform .08s ease}
.btn:active{transform:translateY(3px);box-shadow:0 4px 0 rgba(20,20,70,.45)}
.btn.alt{background:linear-gradient(180deg,#5ec8ff 0%,#2f7de0 100%)}
.btn svg{width:24px;height:24px;fill:currentColor;flex:none}
.soon{opacity:.55;pointer-events:none;filter:grayscale(.6)}

</style></head>
<body><main>
  <img class="logo" src="../assets/dumbojump_logo.png" alt="Dumbo Jump">
  <h1><span data-en="Draw a line. It&#x27;s a platform.">선을 그으면 발판이 돼요</span><b data-en="Climb 7,000 m 🐙">7,000m를 올라라 🐙</b></h1>
  <p class="sub" data-en="Free · One hand · Escape the deep sea">무료 · 한 손으로 · 심해 탈출</p>
  <a class="btn" id="ios" href="https://apps.apple.com/app/id6812717941"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.62c.03 3.03 2.66 4.04 2.69 4.05-.02.07-.42 1.44-1.39 2.85-.84 1.22-1.71 2.44-3.08 2.46-1.35.03-1.78-.8-3.33-.8-1.54 0-2.02.78-3.3.83-1.32.05-2.33-1.32-3.18-2.54-1.73-2.5-3.06-7.07-1.28-10.15.88-1.53 2.46-2.5 4.17-2.53 1.3-.02 2.53.88 3.33.88.79 0 2.29-1.09 3.86-.93.66.03 2.5.27 3.69 2.01-.1.06-2.2 1.28-2.18 3.82M13.84 3.19c.7-.85 1.18-2.04 1.05-3.22-1.01.04-2.24.68-2.97 1.53-.65.75-1.22 1.96-1.07 3.12 1.13.09 2.28-.57 2.99-1.43"/></svg> App Store</a>
  <a class="btn alt" id="play" href="https://play.google.com/store/apps/details?id=com.nekarose.dumbojump"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 1.8 13.8 12 3.6 22.2c-.35-.2-.6-.6-.6-1.1V2.9c0-.5.25-.9.6-1.1m11.3 11.3 2.4 2.4-11.2 6.4 8.8-8.8m3.7-3.7 2.9 1.7c.8.5.8 1.3 0 1.8l-2.9 1.7-2.6-2.6 2.6-2.6M6.1 2.1l11.2 6.4-2.4 2.4-8.8-8.8"/></svg> <span class="lbl">Google Play</span></a>
  <p class="foot"><span data-en="Open this on your phone to jump straight to your store">휴대폰에서 열면 맞는 스토어로 바로 이동해요</span><br>
  <a href="../" id="more"><span data-en="More games from Now, Labs">Now, Labs의 다른 게임</span></a></p>
</main>
<script>
document.getElementById("ios").href = IOS;
document.getElementById("play").href = PLAY;
if (!PLAY_LIVE) soon(document.getElementById("play"));
if (SRC) document.getElementById("more").href = "../?src=" + SRC;
applyLang();
if (IS_ANDROID) document.querySelector("main").insertBefore(document.getElementById("play"), document.getElementById("ios"));
</script>
</body></html>
