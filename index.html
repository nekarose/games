<html lang="ko"><head>

<meta name="description" content="Now, Labs — Dumbo Drop · Dumbo Jump">
<meta property="og:title" content="Now, Labs">
<meta property="og:description" content="덤보드랍 · 덤보점프">
<meta property="og:image" content="https://nekarose.github.io/games/assets/dumbodrop_icon.png">
<meta property="og:type" content="website">
<link rel="icon" href="assets/dumbodrop_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<script>
var SRC = (new URLSearchParams(location.search).get("src") || "").replace(/[^a-z0-9_-]/gi, "").slice(0, 40);
function iosUrl(id) { return "https://apps.apple.com/app/id" + id; }
function playUrl(pkg, content) {
  var u = "https://play.google.com/store/apps/details?id=" + pkg;
  if (SRC) u += "&referrer=" + encodeURIComponent("utm_source=" + SRC + "&utm_medium=social&utm_campaign=link&utm_content=" + content);
  return u;
}
var UA = navigator.userAgent;
// iPadOS reports itself as a Mac; a Mac with a touch screen is an iPad.
var IS_IOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
var IS_ANDROID = /Android/.test(UA);
function soon(a) {
  a.removeAttribute("href"); a.classList.add("soon");
  a.querySelector("span, .lbl").textContent = /^ko\b/i.test(navigator.language || "") ? "Google Play 곧 출시" : "Google Play coming soon";
}
function applyLang() {
  if (/^ko\b/i.test(navigator.language || "")) return;
  document.documentElement.lang = "en";
  document.querySelectorAll("[data-en]").forEach(function (el) { el.textContent = el.dataset.en; });
}
</script>
<style>
:root{--bg:#eef7ff;--ink:#1a1f5c;--card:#fff;--muted:#5a6a8a}
*{box-sizing:border-box} html,body{margin:0}
body{min-height:100vh;padding:40px 16px 48px;background:linear-gradient(180deg,#bfe9ff 0%,var(--bg) 40%);
 font-family:"Do Hyeon","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink)}
main{max-width:520px;margin:0 auto}
header{text-align:center;margin-bottom:26px}
header h1{margin:0;font-weight:400;font-size:40px;letter-spacing:.5px}
header p{margin:6px 0 0;color:var(--muted);font-size:17px}
.card{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:26px;padding:16px;margin:0 0 16px;
 box-shadow:0 8px 0 rgba(26,31,92,.08),0 10px 30px rgba(26,31,92,.08)}
.icon{width:96px;height:96px;border-radius:22px;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.info{min-width:0;flex:1}
.info h2{margin:0;font-weight:400;font-size:26px}
.info p{margin:4px 0 12px;color:var(--muted);font-size:16px;line-height:1.35}
.stores{display:flex;gap:8px;flex-wrap:wrap}
.s{display:inline-flex;align-items:center;gap:6px;padding:9px 14px 7px;border-radius:999px;text-decoration:none;
 color:#fff;font-size:17px;background:linear-gradient(180deg,#FFB43A 0%,#FF7A1A 100%);box-shadow:0 4px 0 rgba(20,20,70,.3)}
.s.play{background:linear-gradient(180deg,#5ec8ff 0%,#2f7de0 100%)}
.s svg{width:18px;height:18px;fill:currentColor}
.s.only{font-size:19px;padding:11px 22px 9px}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:22px}
</style></head>
<body><main>
  <header><h1>Now, Labs</h1><p data-en="One-hand games starring Dumbo">덤보와 함께하는 한 손 게임</p></header>

        <a class="s play" href="https://play.google.com/store/apps/details?id=com.nekarose.photo_puzzle_game"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 1.8 13.8 12 3.6 22.2c-.35-.2-.6-.6-.6-1.1V2.9c0-.5.25-.9.6-1.1m11.3 11.3 2.4 2.4-11.2 6.4 8.8-8.8m3.7-3.7 2.9 1.7c.8.5.8 1.3 0 1.8l-2.9 1.7-2.6-2.6 2.6-2.6M6.1 2.1l11.2 6.4-2.4 2.4-8.8-8.8"/></svg><span>Google Play</span></a>

    </div>

  <footer>© Now, Labs</footer>
</main>
<script>
applyLang();
document.querySelectorAll(".card").forEach(function (c) {
  var ios = c.querySelector(".ios"), play = c.querySelector(".play");
  ios.href = iosUrl(c.dataset.ios);
  play.href = playUrl(c.dataset.pkg, "hub_" + c.dataset.slug);
  if (c.dataset.play === "0") { soon(play); if (IS_ANDROID) { ios.remove(); return; } }
  // On a phone only that phone's store is useful: keep one big button.
  if (IS_IOS) { play.remove(); ios.classList.add("only"); }
  else if (IS_ANDROID) { ios.remove(); play.classList.add("only"); }
});
</script>
</body></html>
